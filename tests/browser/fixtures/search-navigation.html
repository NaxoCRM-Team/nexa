<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nexa search and navigation fixture</title>
    <link rel="stylesheet" href="../../../espocrm/client/custom/css/tenant-search.css">
    <style>
        * { box-sizing: border-box; }
        body { color: #20383f; font: 14px Arial, sans-serif; margin: 0; }
        header { align-items: center; background: #fff; border-bottom: 1px solid #d7e0e3; display: flex; gap: 16px; height: 64px; padding: 0 18px; }
        .brand { color: #0f6669; font-size: 18px; font-weight: 800; text-decoration: none; }
        .tenant { margin-left: auto; }
        .global-search-container { width: min(560px, 46vw); }
        .input-group { display: flex; height: 38px; }
        .input-group input { border: 1px solid #cbd7dc; border-radius: 6px 0 0 6px; min-width: 0; padding: 0 12px; width: 100%; }
        .input-group button { background: #f4f7f8; border: 1px solid #cbd7dc; border-left: 0; border-radius: 0 6px 6px 0; width: 40px; }
        .layout { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 64px); }
        nav { border-right: 1px solid #d7e0e3; max-height: calc(100vh - 64px); overflow-y: auto; padding: 10px; }
        nav a { color: #30474f; display: block; padding: 11px; text-decoration: none; }
        nav a:focus, nav a:hover { background: #eaf3f3; }
        main { background: #f6f8fa; padding: 24px; }
        .mobile-menu { display: none; }
        .status { margin: 0; }
        @media (max-width: 767px) {
            header { height: auto; min-height: 58px; padding: 8px; }
            .mobile-menu { display: block; }
            .tenant { display: none; }
            .global-search-container { margin-left: auto; width: min(72vw, 420px); }
            .layout { display: block; min-height: calc(100vh - 58px); }
            nav { background: #fff; display: none; height: calc(100vh - 58px); max-height: none; position: fixed; width: min(88vw, 320px); z-index: 2; }
            nav.open { display: block; }
            main { padding: 16px; }
        }
    </style>
</head>
<body>
<header>
    <button class="mobile-menu" type="button" aria-label="Open workspace navigation" aria-controls="modules" aria-expanded="false">Menu</button>
    <a class="brand" href="#home">Nexa CRM</a>
    <div class="tenant" aria-label="Current workspace: Atlas Advisory">Atlas Advisory</div>
    <div class="global-search-container">
        <div class="input-group" role="search">
            <label class="sr-only" for="search">Search across this workspace</label>
            <input id="search" type="search" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" autocomplete="off">
            <button type="button" aria-label="Search workspace">Search</button>
        </div>
        <section class="nexa-search-suggestion-panel" aria-label="Search suggestions" hidden>
            <header><strong class="nexa-search-suggestions-heading">Suggestions</strong><button type="button" data-action="clear">Clear</button></header>
            <div id="suggestions" class="nexa-search-suggestions" role="listbox"></div>
        </section>
    </div>
</header>
<div class="layout">
    <nav id="modules" aria-label="Workspace modules">
        <a href="#home">Home</a><a href="#account">Accounts</a><a href="#contact">Contacts</a>
        <a href="#lead">Leads</a><a href="#opportunity">Opportunities</a><a href="#campaign">Campaigns</a>
        <a href="#email">Marketing email</a><a href="#workflow">Automation</a><a href="#service">Service</a>
        <a href="#analytics">Analytics</a><a href="#integration">Integrations</a><a href="#settings">Settings</a>
    </nav>
    <main><h1>Customer workspace</h1><p class="status" role="status">Ready</p></main>
</div>
<script>
    const params = new URLSearchParams(location.search);
    const tenantId = params.get('tenant') || '49b76794-5e0b-4d85-ae95-c958ebaa0001';
    const userId = params.get('user') || 'user-1';
    const key = `nexaGlobalSearchRecent:${tenantId}:${userId}`;
    const input = document.querySelector('#search');
    const panel = document.querySelector('.nexa-search-suggestion-panel');
    const list = document.querySelector('#suggestions');
    const modules = [...document.querySelectorAll('nav a')].map(link => ({label: link.textContent, url: link.href}));
    let active = -1;
    let suggestions = [];
    const recents = () => JSON.parse(localStorage.getItem(key) || '[]');
    const save = value => localStorage.setItem(key, JSON.stringify([value, ...recents().filter(item => item !== value)].slice(0, 6)));
    const render = () => {
        const query = input.value.trim();
        suggestions = query ? [{label: query, type: 'search'}, ...modules.filter(item => item.label.toLowerCase().includes(query.toLowerCase())).slice(0, 4)] : recents().map(label => ({label, type: 'recent'}));
        list.replaceChildren(...suggestions.map((item, index) => {
            const button = document.createElement('button'); button.type = 'button'; button.className = 'nexa-search-suggestion';
            button.dataset.index = index; button.id = `option-${index}`; button.setAttribute('role', 'option'); button.setAttribute('aria-selected', 'false');
            button.textContent = item.type === 'search' ? `Search workspace for ${item.label}` : item.label; return button;
        }));
        panel.hidden = suggestions.length === 0; input.setAttribute('aria-expanded', String(suggestions.length > 0)); active = -1;
    };
    const activate = item => { if (item.type === 'search' || item.type === 'recent') { save(item.label); document.querySelector('.status').textContent = `Results for ${item.label}`; panel.hidden = true; } else location.hash = new URL(item.url).hash; };
    input.addEventListener('focus', render); input.addEventListener('input', render);
    input.addEventListener('keydown', event => {
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') { event.preventDefault(); active = event.key === 'ArrowDown' ? Math.min(suggestions.length - 1, active + 1) : Math.max(0, active - 1); [...list.children].forEach((el, i) => el.setAttribute('aria-selected', String(i === active))); input.setAttribute('aria-activedescendant', `option-${active}`); }
        if (event.key === 'Enter' && active >= 0) { event.preventDefault(); activate(suggestions[active]); }
        if (event.key === 'Escape') { panel.hidden = true; input.setAttribute('aria-expanded', 'false'); }
    });
    list.addEventListener('click', event => { const option = event.target.closest('[data-index]'); if (option) activate(suggestions[Number(option.dataset.index)]); });
    document.querySelector('[data-action=clear]').addEventListener('click', () => { localStorage.removeItem(key); render(); });
    document.addEventListener('keydown', event => { if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); input.focus(); } });
    const menu = document.querySelector('.mobile-menu'); const nav = document.querySelector('nav');
    menu.addEventListener('click', () => { const open = nav.classList.toggle('open'); menu.setAttribute('aria-expanded', String(open)); if (open) nav.querySelector('a').focus(); });
    nav.addEventListener('keydown', event => { const links = [...nav.querySelectorAll('a')]; const i = links.indexOf(document.activeElement); if (event.key === 'ArrowDown') { event.preventDefault(); links[(i + 1) % links.length].focus(); } if (event.key === 'Escape') { nav.classList.remove('open'); menu.setAttribute('aria-expanded', 'false'); menu.focus(); } });
</script>
</body>
</html>
