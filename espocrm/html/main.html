<!doctype html>
<html>
    <head>
        <title>{{applicationName}}</title>
        <script type="application/json" data-name="loader-params">{{loaderParams}}</script>{{scriptsHtml}}
        <link rel="stylesheet" href="{{basePath}}{{stylesheet}}?r={{cacheTimestamp}}" id='main-stylesheet'>{{additionalStyleSheetsHtml}}{{linksHtml}}
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta content="utf-8" http-equiv="encoding">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="description" content="{{applicationDescription}}">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="alternate icon" href="{{basePath}}{{faviconAlternate}}" type="image/x-icon">
        <link rel="icon" href="{{basePath}}{{favicon}}" type="{{faviconType}}">
        <script nonce="{{nonce}}">
            // Espo lazy-loads bundles and theme assets after authentication. Keep
            // their relative URLs anchored to the page that booted the client,
            // even when the visible workspace pathname changes.
            const runtimeBase = document.createElement('base');
            runtimeBase.href = window.location.href.split(/[?#]/)[0];
            document.head.append(runtimeBase);

            const showStartupFailure = () => {
                let loader = document.querySelector('.nexa-startup-error');

                if (loader?.dataset.failed) {
                    return;
                }

                if (!loader) {
                    loader = document.createElement('div');
                    loader.className = 'nexa-startup-error';
                    document.body.append(loader);
                }

                loader.dataset.failed = 'true';
                loader.setAttribute('role', 'alert');
                loader.innerHTML = `
                    <strong>We couldn't open your workspace.</strong>
                    <span>Please check the connection and try again.</span>
                    <button type="button" class="btn btn-primary">Try again</button>
                `;
                loader.querySelector('button').addEventListener('click', () => window.location.reload());
            };

            window.addEventListener('error', event => {
                if (event.target instanceof HTMLScriptElement || event.target instanceof HTMLLinkElement) {
                    showStartupFailure();
                }
            }, true);
            window.addEventListener('unhandledrejection', showStartupFailure);

            let loadedApp;

            const run = app => {
                {{runScript}}
            };

            const init = () => {
                require('{{appClientClassName}}', App => {
                    new App({
                        id: '{{applicationId}}',
                        useCache: {{useCache}},
                    cacheTimestamp: {{cacheTimestamp}},
                    appTimestamp: {{appTimestamp}},
                    basePath: '{{basePath}}',
                    apiUrl: '{{apiUrl}}',
                    ajaxTimeout: {{ajaxTimeout}},
                    internalModuleList: {{internalModuleList}},
                    bundledModuleList: {{bundledModuleList}},
                    theme: {{theme}},
                }, app => {
                        loadedApp = app;

                        run(app);
                    });
                });
            };

            window.addEventListener('pageshow', event => {
                if (event.persisted && loadedApp) {
                    run(loadedApp);

                    return;
                }

                init();
            });
        </script>
    </head>
    <body data-id="{{applicationId}}">
        <div class="container content"></div>
        <footer>
            <p class="credit small">&copy; 2025
            <a href="https://www.espocrm.com" title="Powered by EspoCRM" rel="noopener" target="_blank">EspoCRM</a></p>
        </footer>
    </body>
</html>
