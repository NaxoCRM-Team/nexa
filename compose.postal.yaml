name: nexa-postal-local

x-postal: &postal
  image: ghcr.io/postalserver/postal:3.3.7
  environment: &postal-environment
    MAIN_DB_HOST: postal-database
    MAIN_DB_USERNAME: root
    MAIN_DB_PASSWORD: ${POSTAL_DB_PASSWORD:?Run setup-postal-local.ps1 first}
    MAIN_DB_DATABASE: postal
    MESSAGE_DB_HOST: postal-database
    MESSAGE_DB_USERNAME: root
    MESSAGE_DB_PASSWORD: ${POSTAL_DB_PASSWORD:?Run setup-postal-local.ps1 first}
    RAILS_SECRET_KEY: ${POSTAL_RAILS_SECRET_KEY:?Run setup-postal-local.ps1 first}
    POSTAL_WEB_HOSTNAME: localhost:8443
    POSTAL_WEB_PROTOCOL: https
    POSTAL_SMTP_HOSTNAME: postal.local.test
    POSTAL_SMTP_RELAYS: smtp://mailpit:1025
    WEB_SERVER_DEFAULT_BIND_ADDRESS: 0.0.0.0
    POSTAL_ALLOWED_REQUEST_DESTINATIONS: postal-event-capture
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_ENABLE_STARTTLS_AUTO: "false"
    WAIT_FOR_TARGETS: postal-database:3306
  volumes:
    - ./.local/postal/config:/config
    - ./infrastructure/postal:/bootstrap:ro
  networks: [postal-internal]

services:
  postal-event-capture:
    <<: *postal
    command: ruby /bootstrap/capture-events.rb
    restart: unless-stopped

  postal-database:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${POSTAL_DB_PASSWORD:?Run setup-postal-local.ps1 first}
      MARIADB_DATABASE: postal
    volumes: [postal-database:/var/lib/mysql]
    networks: [postal-internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  postal-web:
    <<: *postal
    command: postal web-server
    depends_on:
      postal-database: {condition: service_healthy}
    restart: unless-stopped

  postal-worker:
    <<: *postal
    command: postal worker
    depends_on:
      postal-database: {condition: service_healthy}
      mailpit: {condition: service_started}
    restart: unless-stopped

  postal-smtp:
    <<: *postal
    command: postal smtp-server
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      postal-database: {condition: service_healthy}
    restart: unless-stopped

  postal-runner:
    <<: *postal
    profiles: [tools]
    environment:
      <<: *postal-environment
      POSTAL_LOCAL_ADMIN_PASSWORD: ${POSTAL_LOCAL_ADMIN_PASSWORD:?Run setup-postal-local.ps1 first}

  postal-proxy:
    image: caddy:2.10.2-alpine
    ports: ["127.0.0.1:8443:443"]
    volumes:
      - ./infrastructure/postal/Caddyfile:/etc/caddy/Caddyfile:ro
      - postal-caddy:/data
    networks: [postal-internal, postal-edge]
    depends_on: [postal-web]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ["127.0.0.1:8026:8025"]
    volumes: [postal-mailpit:/data]
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    networks: [postal-internal, postal-edge]
    restart: unless-stopped

networks:
  postal-internal: {internal: true}
  postal-edge: {}

volumes:
  postal-database:
  postal-caddy:
  postal-mailpit:
